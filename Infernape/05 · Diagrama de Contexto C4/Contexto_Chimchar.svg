<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">SkyCampus — Diagrama de Contexto C4, nivel 1</title>
  <desc id="desc">Actores Operador de drones, Solicitante y Admin interactúan con SkyCampus App. No hay sistemas externos en el MVP.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#536273"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2C5E8A"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { fill: #172B4D; font-size: 25px; font-weight: 700; }
      .subtitle { fill: #536273; font-size: 15px; }
      .actor-label { fill: #4A8C45; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .system-title { fill: #172B4D; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .system-text { fill: #394B59; font-size: 14px; text-anchor: middle; }
      .flow { fill: #172B4D; font-size: 13px; text-anchor: middle; }
      .note { fill: #394B59; font-size: 13px; }
      .muted { fill: #536273; font-size: 12px; }
    </style>
  </defs>
  <rect width="1200" height="780" fill="#F7F8FA"/>
  <text class="title" x="55" y="48">SkyCampus — Diagrama de Contexto C4 · Nivel 1</text>
  <text class="subtitle" x="57" y="78">Chimchar · MVP de reparto interno en el campus ECI</text>

  <!-- Flows behind nodes -->
  <path d="M280 155 H380 V305 H790" fill="none" stroke="#536273" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
  <path d="M790 325 H440 V185 H280" fill="none" stroke="#536273" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
  <path d="M280 395 H790" fill="none" stroke="#536273" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
  <path d="M790 425 H440 V415 H280" fill="none" stroke="#536273" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
  <path d="M280 625 H520 V455 H790" fill="none" stroke="#536273" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
  <path d="M790 475 H560 V665 H280" fill="none" stroke="#536273" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>

  <!-- Flow labels -->
  <g><rect x="305" y="100" width="300" height="48" rx="6" fill="#FFFFFF" stroke="#D9DEE5"/><text class="flow" x="455" y="120"><tspan x="455">Asigna misión y confirma entrega</tspan><tspan x="455" dy="17">(drone seleccionado, estado)</tspan></text></g>
  <g><rect x="485" y="205" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#D9DEE5"/><text class="flow" x="625" y="225"><tspan x="625">Muestra flota disponible</tspan><tspan x="625" dy="17">(id, batería, ubicación) y estado</tspan></text></g>
  <g><rect x="325" y="335" width="320" height="48" rx="6" fill="#FFFFFF" stroke="#D9DEE5"/><text class="flow" x="485" y="355"><tspan x="485">Registra solicitud (origen, destino,</tspan><tspan x="485" dy="17">tipo de documento)</tspan></text></g>
  <g><rect x="485" y="435" width="280" height="48" rx="6" fill="#FFFFFF" stroke="#D9DEE5"/><text class="flow" x="625" y="455"><tspan x="625">Devuelve código de misión</tspan><tspan x="625" dy="17">y confirmación de recepción</tspan></text></g>
  <g><rect x="315" y="535" width="240" height="48" rx="6" fill="#FFFFFF" stroke="#D9DEE5"/><text class="flow" x="435" y="555"><tspan x="435">Configura destinos fijos</tspan><tspan x="435" dy="17">y datos de la flota</tspan></text></g>
  <g><rect x="580" y="675" width="190" height="48" rx="6" fill="#FFFFFF" stroke="#D9DEE5"/><text class="flow" x="675" y="695"><tspan x="675">Confirma destinos</tspan><tspan x="675" dy="17">y flota configurada</tspan></text></g>

  <!-- Actors -->
  <g>
    <rect x="70" y="130" width="210" height="78" rx="22" fill="#FFFFFF" stroke="#4A8C45" stroke-width="2.4"/>
    <circle cx="175" cy="108" r="25" fill="#FFFFFF" stroke="#4A8C45" stroke-width="2.4"/>
    <text class="actor-label" x="175" y="174">Person: Operador de drones</text>
  </g>
  <g>
    <rect x="70" y="365" width="210" height="78" rx="22" fill="#FFFFFF" stroke="#4A8C45" stroke-width="2.4"/>
    <circle cx="175" cy="343" r="25" fill="#FFFFFF" stroke="#4A8C45" stroke-width="2.4"/>
    <text class="actor-label" x="175" y="409">Person: Solicitante</text>
  </g>
  <g>
    <rect x="70" y="600" width="210" height="78" rx="22" fill="#FFFFFF" stroke="#4A8C45" stroke-width="2.4"/>
    <circle cx="175" cy="578" r="25" fill="#FFFFFF" stroke="#4A8C45" stroke-width="2.4"/>
    <text class="actor-label" x="175" y="644">Person: Admin</text>
  </g>

  <!-- System -->
  <rect x="790" y="270" width="340" height="220" rx="16" fill="#F3F8FC" stroke="#3982B8" stroke-width="2.5"/>
  <text x="815" y="305" fill="#3982B8" font-size="12" font-weight="700" letter-spacing="1">SOFTWARE SYSTEM</text>
  <text class="system-title" x="960" y="350">SkyCampus App</text>
  <line x1="850" y1="370" x2="1070" y2="370" stroke="#C7DCEB" stroke-width="1.5"/>
  <text class="system-text" x="960" y="399"><tspan x="960">Sistema de gestión del reparto interno</tspan><tspan x="960" dy="24">5 drones · destinos fijos · asignación manual</tspan></text>

  <rect x="790" y="535" width="340" height="75" rx="8" fill="#F3F5F7" stroke="#C6CDD5"/>
  <text class="note" x="810" y="562"><tspan x="810" font-weight="700">Sistemas externos: ninguno en el MVP.</tspan><tspan x="810" dy="20">Los drones se controlan localmente, sin API externa.</tspan></text>
  <line x1="790" y1="700" x2="830" y2="700" stroke="#536273" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
  <text class="muted" x="840" y="704">Relación con dirección y datos etiquetados</text>
</svg>
